
# Weekly "what moved upstream". Separate from the gate on purpose: this one
# talks to the network, so it is neither free nor deterministic and must never
# gate a merge. It reports into the run summary rather than failing the build —
# entries drift upstream constantly, and a permanently red badge stops being a
# signal. Add --strict below if you would rather it fail on anything that moved.
name: upstream
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

# Reads the tree, writes only the step summary. Neither needs more than this.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA rather than tag; see .github/workflows/gate.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Compare pins against upstream
        run: |
          {
            echo '## Upstream check'
            echo '```'
            node tools/skills-update.mjs check
            echo '```'
            echo 'Act on it with `/skills-update`.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
