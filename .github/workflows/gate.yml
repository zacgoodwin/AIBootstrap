name: gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/gate.mjs
      - run: node tools/gate.mjs --check
      - run: node .claude/hooks/filter-test-output.mjs --check
      - run: bash -n bootstrap.sh
      - run: pwsh -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "bootstrap.ps1"), [ref]$null, [ref]$e); if ($e) { $e; exit 1 }'
